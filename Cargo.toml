[package]
name = "wyvern"
version = "0.9.2"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "blocking", "multipart", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
eframe = "0.31"
mimalloc = "0.1"
base64 = "0.22"
image = "0.25"
arboard = "3"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
md-5 = "0.10"
hkdf = "0.12"
sha1 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
dirs = "6"
